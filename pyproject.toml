[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "resumable-file-server"
version = "0.1.0a6"
description = "A simple, multithreaded HTTP file server supporting resumable downloads and streaming file uploads, written in pure Python with httppackets and minimal-thread-pool."
readme = "README.md"
requires-python = ">=2"
license = "MIT"
authors = [
  { name="Jifeng Wu", email="jifengwu2k@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "enum34; python_version < '3.4'",
    "fspathverbs",
    "guess-file-mime-type",
    "httppackets",
    "minimal-thread-pool",
    "parse-multipart-form-data",
    "textcompat",
    "typing; python_version < '3.5'",
]

[project.scripts]
resumable_file_server = "resumable_file_server:main"

[project.urls]
"Homepage" = "https://github.com/jifengwu2k/resumable-file-server"
"Bug Tracker" = "https://github.com/jifengwu2k/resumable-file-server/issues"

[tool.setuptools]
py-modules = ["resumable_file_server"]
